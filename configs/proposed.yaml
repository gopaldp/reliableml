# Proposed MLOps Pipeline Configuration
# Full pipeline with quality gates, tracking, and monitoring

pipeline:
  type: proposed
  name: mlops-pipeline
  description: Production-grade ML pipeline with automated quality gates and drift monitoring

# Data validation with Pandera
data_validation:
  enabled: true
  schema_strict: true
  fail_fast: false
  report_path: ./reports/data_validation_report.json

# Data quality gates (blocking)
data_quality_gates:
  enabled: true
  blocking: true
  rules:
    max_missing_ratio: 0.05
    max_duplicate_ratio: 0.01
    require_positive_price: true
    require_non_negative_inventory: true
    valid_promotion_values: [0, 1]
    temperature_range: [-30, 50]
    min_required_rows: 100

# Model quality gates (blocking before registration)
model_quality_gates:
  enabled: true
  blocking: true
  thresholds:
    max_rmse: 150.0
    max_mape: 0.25
    min_r2: 0.5  # Adjusted to allow current model
    max_inference_latency_ms: 100

# MLflow experiment tracking
tracking:
  enabled: true
  mlflow:
    tracking_uri: sqlite:///mlruns.db
    experiment_name: reliableml-sales-forecasting
    artifact_root: ./artifacts/mlruns
    log_model: true
    log_params: true
    log_metrics: true
    log_artifacts: true
    log_code_version: true
    log_environment: true
    log_dataset_fingerprint: true

# Model registry
registry:
  enabled: true
  registered_model_name: sales-demand-forecaster
  model_alias: champion
  auto_register_on_quality_pass: true
  tags:
    project: reliableml
    use_case: sales-forecasting
    framework: lightgbm

# Evaluation
evaluation:
  metrics:
    - mae
    - rmse
    - r2
    - mape
  save_predictions: true
  predictions_path: ./artifacts/predictions.parquet

# Pipeline outputs
outputs:
  pipeline_summary: ./reports/proposed_pipeline_summary.json
  model_card: ./reports/model_card.json
